stages:
  prepare:
    cmd: python3 src/prepare.py
    deps:
    - data/raw.csv
    - src/prepare.py
    outs:
    - data/clean.csv
  train:
    cmd: python3 src/train.py
    deps:
    - data/clean.csv
    - src/train.py
    outs:
    - model.pkl
  evaluate:
    cmd: python3 src/evaluate.py
    deps:
    - model.pkl
    - src/evaluate.py
    metrics:
    - metrics.json:
        cache: false
